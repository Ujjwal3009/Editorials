server:
  port: 8080

spring:
  application:
    name: upsc-editorial-desk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/upsc_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false

# 🛡️ GEMINI AI FEATURE FLAG (OFF BY DEFAULT)
gemini:
  enabled: ${GEMINI_ENABLED:true}
  apiKey: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  timeoutSeconds: 15

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
