name: Daily UPSC Ingestion Worker

on:
  schedule:
    # Runs at 00:00 UTC (5:30 AM IST) every morning
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: |
          cd scraper-python
          pip install -r requirements.txt

      - name: Run Daily Ingestion Worker
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:8080' }}
        run: |
          cd scraper-python
          python cron_worker.py
